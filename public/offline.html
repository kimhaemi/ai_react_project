<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>오프라인 | 관리 시스템</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f9fafb; color: #111827; font-family: system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; padding: 16px; box-sizing: border-box; }
    main { text-align: center; max-width: 320px; }
    img { width: 56px; height: 56px; }
    h1 { font-size: 1.25rem; margin: 16px 0 8px; }
    p { color: #4b5563; font-size: 0.875rem; line-height: 1.6; margin: 0 0 20px; }
    button { border: 0; border-radius: 6px; background: #2563eb; color: #fff; font-size: 0.875rem; font-weight: 600; padding: 10px 20px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>인터넷에 연결되어 있지 않습니다</h1>
    <p>연결 상태를 확인한 뒤 다시 시도해 주세요.<br />Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">다시 시도</button>
  </main>
</body>
</html>
